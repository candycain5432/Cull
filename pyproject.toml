[project]
name = "Cull"
version = "0.1.0"
description = "A program made for photographers who take 2 shots every second ;)"
readme = "README.md"
authors = [
    { name = "William Cain", email = "contact@williamcain.net" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["photography", "culling", "raw", "sharpness", "exposure"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "colorama>=0.4.6",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "rawpy>=0.27.1",
]

[project.urls]
Repository = "https://github.com/candycain5432/Cull"
Issues = "https://github.com/candycain5432/Cull/issues"

[project.scripts]
cull = "cull.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
