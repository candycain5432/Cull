[project]
name = "Cull"
version = "0.1.0"
description = "A program made for photographers who take 2 shots every second ;)"
readme = "README.md"
authors = [
    { name = "William Cain", email = "contact@williamcain.net" }
]
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "pillow>=13.0.0",
]

[project.scripts]
cull = "cull.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "pathlib",
]
